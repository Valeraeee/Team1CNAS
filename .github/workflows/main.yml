name: Secure DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup PHP & Recursive Linter
      - name: Setup PHP and Run Linter
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run PHP Syntax Check Across All Subdirectories
        run: find . -type f -name "*.php" -exec php -l {} +

      # Step 3: SAST Code Analysis (SonarQube)
      - name: SonarQube Scan (SAST)
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Step 4: Docker Registry Authentication
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Automatically Find and Build All Dockerfiles
      - name: Build All Docker Images Recursively
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          find . -mindepth 2 -type f -name "Dockerfile" | while read -r dockerfile; do
            dir=$(dirname "$dockerfile" | sed 's|^\./||')
            image_name=$(echo "$dir" | tr '/' '-')
            echo "Building image for directory: $dir as $image_name"
            docker build -t "${DOCKERHUB_USERNAME}/${image_name}:latest" -f "$dockerfile" "$dir"
          done

      # Step 6: Vulnerability & Secret Scanning (Trivy)
      - name: Scan Built Images with Trivy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          find . -mindepth 2 -type f -name "Dockerfile" | while read -r dockerfile; do
            dir=$(dirname "$dockerfile" | sed 's|^\./||')
            image_name=$(echo "$dir" | tr '/' '-')
            echo "Scanning image: ${image_name}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --format table \
              --exit-code 1 \
              --severity CRITICAL,HIGH \
              "${DOCKERHUB_USERNAME}/${image_name}:latest"
          done

      # Step 7: Push All Built Images to Registry
      - name: Push All Docker Images to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          find . -mindepth 2 -type f -name "Dockerfile" | while read -r dockerfile; do
            dir=$(dirname "$dockerfile" | sed 's|^\./||')
            image_name=$(echo "$dir" | tr '/' '-')
            echo "Pushing image: ${image_name}"
            docker push "${DOCKERHUB_USERNAME}/${image_name}:latest"
          done

      # Step 8: Cloud Authentication & GKE Credentials Setup
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with: 
          workload_identity_provider: 'projects/471203131665/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'cnas-cicd-sa@cnas-team1-project.iam.gserviceaccount.com'

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Step 9: Deploy All Manifests & Trigger Rolling Update
      - name: Apply Namespaces First
        run: |
          find k8s/ -type f -name "*namespace*.yaml" -exec kubectl apply -f {} \; || true

      - name: Apply All Kubernetes Manifests Recursively
        run: kubectl apply -f k8s/ --recursive

      - name: Force Rollout Restarts
        run: |
          kubectl rollout restart deployment --all || true
          kubectl rollout restart statefulset --all || true
