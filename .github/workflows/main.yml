name: Secure DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP and Run Linter
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run PHP Syntax Check
        run: find php-webapp -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: SonarQube Scan (SAST)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/php-app:latest ./php-webapp

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/php-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/php-app:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with: 
          workload_identity_provider: 'projects/471203131665/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'cnas-cicd-sa@cnas-team1-project.iam.gserviceaccount.com'

      - name: Get GKA credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/ --recursive

      - name: Force rollout to pick up freshly pushed image
        run: |
          kubectl rollout restart deployment/php-app
          kubectl rollout status deployment/php-app --timeout=180s

