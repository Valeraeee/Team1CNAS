name: Secure DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_TEST_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_TEST_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p"$MYSQL_ROOT_PASSWORD""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.DB_TEST_ROOT_PASSWORD }}
      DB_NAME: ${{ secrets.DB_TEST_NAME }}

    steps:
      # Fixes the 'mysqladmin: command not found' crash on ubuntu-latest
      - name: Install MySQL Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      # Step 1: Checkout Repository (SHA-pinned v4.2.2)
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Step 2: Setup PHP & Recursive Linter
      - name: Setup PHP & Xdebug
        uses: shivammathur/setup-php@a23d463b361a9aa685e135be36bca42b36c764e5 # v2.27.0
        with:
          php-version: '8.1'
          coverage: xdebug
          extensions: mysqli

      # Step 3: SAST Code Analysis (SonarQube)
      - name: SonarQube Scan (SAST)
        uses: sonarsource/sonarqube-scan-action@51cd4a5951d9d7fb6d10db9f187a5de25e982195 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Step 4: Docker Registry Authentication (SHA-pinned v3.3.0)
      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Automatically Find and Build All Dockerfiles
      - name: Build All Docker Images Recursively
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          find . -mindepth 2 -type f -name "Dockerfile" | while read -r dockerfile; do
            dir=$(dirname "$dockerfile" | sed 's|^\./||')
            image_name=$(echo "$dir" | tr '/' '-')
            echo "Building image for directory: $dir as $image_name"
            docker build -t "${DOCKERHUB_USERNAME}/${image_name}:latest" -f "$dockerfile" "$dir"
          done

      # Step 6: Vulnerability & Secret Scanning (Trivy - Pinned to safe immutable image digest)
      - name: Scan Built Images with Trivy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          find . -mindepth 2 -type f -name "Dockerfile" | while read -r dockerfile; do
            dir=$(dirname "$dockerfile" | sed 's|^\./||')
            image_name=$(echo "$dir" | tr '/' '-')
            echo "Scanning image: ${image_name}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:0d6df6cf2a3161c16924b22c7a20c9f1311ff98f6d7647895e791e25e982cd6d image --format table --exit-code 1 --severity CRITICAL,HIGH "${DOCKERHUB_USERNAME}/${image_name}:latest"
          done

      # Step 7: Push All Built Images to Registry
      - name: Push All Docker Images to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          find . -mindepth 2 -type f -name "Dockerfile" | while read -r dockerfile; do
            dir=$(dirname "$dockerfile" | sed 's|^\./||')
            image_name=$(echo "$dir" | tr '/' '-')
            echo "Pushing image: ${image_name}"
            docker push "${DOCKERHUB_USERNAME}/${image_name}:latest"
          done

      # Step 8: Cloud Authentication & GKE Credentials Setup
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@efbc0dcbbcd48d3db81d6cd1c8091176b6d510e8 # v2.1.3
        with:
          workload_identity_provider: 'projects/471203131665/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'cnas-cicd-sa@://gserviceaccount.com'

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3102c918ec996cc966c75899bdf483b8a13a693c # v2.1.0
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Step 9: Deploy All Manifests & Trigger Rolling Update
      - name: Apply Namespaces First
        run: find k8s/ -type f -name "*namespace*.yaml" -exec kubectl apply -f {} \; || true

      - name: Apply All Kubernetes Manifests Recursively
        run: kubectl apply -f k8s/ --recursive

      - name: Force Rollout Restarts
        run: |
          kubectl rollout restart deployment --all || true
          kubectl rollout restart statefulset --all || true

      # Step 10: Team Notifications (Discord Webhook via cURL)
      - name: Notify Discord on Success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{"embeds": [{"title": "✅ DevSecOps Pipeline Succeeded!", "description": "Branch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nStatus: All SAST, Trivy, and GKE Deployment steps passed.", "color": 65280}]}' "$DISCORD_WEBHOOK"

      - name: Notify Discord on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{"embeds": [{"title": "🚨 DevSecOps Pipeline Failed!", "description": "Branch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nTriggered by: `${{ github.actor }}`\nPlease check GitHub Actions logs for security gate or build failures.", "color": 16711680}]}' "$DISCORD_WEBHOOK"
