# =============================================================================
# Grafana – Jun Wei (ALPHA)
# Visualises metrics from Prometheus and logs from Loki.
# Both datasources are provisioned automatically via ConfigMap so no manual
# setup is needed after deployment.
# Access: http://<node-ip>:32300  (NodePort) — admin / admin on first login
# =============================================================================

# ----- ConfigMap: pre-provision Prometheus + Loki datasources -----
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Prometheus – metrics source
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

      # Loki – logs source
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false

---
# ----- ConfigMap: pre-provision dashboards -----
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

---
# ----- ConfigMap: CNAS application dashboard -----
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  cnas-overview.json: |
    {
      "title": "CNAS Application Overview",
      "uid": "cnas-overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "PHP Pod CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{
            "expr": "rate(container_cpu_usage_seconds_total{pod=~\"php-app.*\"}[5m]) * 100",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 2,
          "title": "PHP Pod Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{
            "expr": "container_memory_working_set_bytes{pod=~\"php-app.*\"}",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 3,
          "title": "MySQL Pod CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{
            "expr": "rate(container_cpu_usage_seconds_total{pod=~\"mysql.*\"}[5m]) * 100",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 4,
          "title": "Running Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 8 },
          "targets": [{
            "expr": "count(kube_pod_status_phase{phase=\"Running\", namespace=\"default\"})",
            "legendFormat": "Running Pods"
          }]
        },
        {
          "id": 5,
          "title": "HPA Replica Count",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 8 },
          "targets": [{
            "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"default\"}",
            "legendFormat": "Current Replicas"
          }]
        },
        {
          "id": 6,
          "title": "PHP App Logs",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
          "targets": [{
            "datasource": "Loki",
            "expr": "{namespace=\"default\", app=\"php-app\"}",
            "legendFormat": ""
          }]
        }
      ]
    }

---
# ----- PVC for Grafana state (dashboards saved by users) -----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# ----- Grafana Deployment -----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472          # Grafana runs as uid 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2   # pinned version
          ports:
            - containerPort: 3000
              name: http
          env:
            # Default admin credentials – change in production
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            # Disable telemetry
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            # Allow embedding in iframes (useful for demo)
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc

---
# ----- Grafana Service (NodePort for external browser access) -----
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 32300     # access at http://<node-ip>:32300
