---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: php-app
  namespace: default
  labels:
    app: php-app

spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Roll out one pod at a time without requiring capacity for a fourth pod.
      # At least two of the three replicas remain available during the update.
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: php-app

  template:
    metadata:
      labels:
        app: php-app

    spec:
      # The PHP application does not access the Kubernetes API, so it does not
      # need a service-account token mounted inside the container.
      automountServiceAccountToken: false

      # Distribute replicas evenly across GKE worker nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: php-app

      containers:
        - name: php
          image: robbinyew/php-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          # Resource Requests & Limits
          # Requests: guaranteed resources scheduled on the node
          # Limits: hard cap - container is killed/throttled if exceeded
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # DB connection env vars (matched to php-webapp/db.php)
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD

          # Startup Probe - gives the app time to boot before liveness kicks in
          # 30 attempts x 10s = 300s max startup window
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30

          # Liveness Probe - restarts container if it becomes unresponsive
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness Probe - removes pod from Service if not ready
          # prevents traffic reaching pods that aren't ready to serve
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      # Allow 30s for in-flight requests to finish before pod is killed
      terminationGracePeriodSeconds: 30
