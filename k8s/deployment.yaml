---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: php-app
  labels:
    app: php-app

spec:
  replicas: 3

  revisionHistoryLimit: 5

  # Zero-downtime rolling updates:
  # maxUnavailable: 0 - never take a pod down before a new one is ready
  # maxSurge: 1       - allow one extra pod above desired count during rollout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: php-app

  template:
    metadata:
      labels:
        app: php-app

    spec:
      containers:
        - name: php
          image: robbinyew/php-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          # Resource Requests & Limits
          # Requests: guaranteed resources scheduled on the node
          # Limits: hard cap - container is killed/throttled if exceeded
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # DB connection env vars (matched to php-webapp/db.php)
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD

          # Startup Probe - gives the app time to boot before liveness kicks in
          # 30 attempts x 10s = 300s max startup window
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30

          # Liveness Probe - restarts container if it becomes unresponsive
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness Probe - removes pod from Service if not ready
          # prevents traffic reaching pods that aren't ready to serve
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      # Allow 30s for in-flight requests to finish before pod is killed
      terminationGracePeriodSeconds: 30
