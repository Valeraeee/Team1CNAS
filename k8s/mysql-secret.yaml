# =============================================================================
# MySQL Secret – stores DB credentials as base64-encoded values
# Referenced by both the MySQL StatefulSet and the PHP Deployment.
#
# To generate your own values:
#   echo -n "yourvalue" | base64
#
# Current values decode to:
#   DB_NAME:     mydb
#   DB_USER:     root
#   DB_PASSWORD: rootpass
#
# IMPORTANT: In production, use Sealed Secrets, Vault, or AWS Secrets Manager
# instead of committing plain base64 values to source control.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: default
type: Opaque
data:
  # echo -n "mydb" | base64
  DB_NAME: bXlkYg==
  # echo -n "root" | base64
  DB_USER: cm9vdA==
  # echo -n "rootpass" | base64
  DB_PASSWORD: cm9vdHBhc3M=
  # echo -n "rootpass" | base64  (used by StatefulSet as MYSQL_ROOT_PASSWORD)
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3M=
