# =============================================================================
# Promtail – Jun Wei (ALPHA)
# DaemonSet: runs one Promtail pod on every cluster node.
# Tails all container logs from /var/log/pods and ships them to Loki,
# automatically tagging each log line with pod name, namespace, and app label.
# =============================================================================

# ----- RBAC: allow Promtail to read pod metadata for log labelling -----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - services
      - pods
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring

---
# ----- ConfigMap: Promtail scrape config -----
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml   # tracks how far each log file has been read

    clients:
      - url: http://loki:3100/loki/api/v1/push   # send logs to Loki Service

    scrape_configs:
      # Scrape all pod logs on this node
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Parse Docker/containerd JSON log format
          - cri: {}
        relabel_configs:
          # Only scrape pods that have not opted out
          - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
            action: drop
            regex: "false"
          # Map pod namespace as a label
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          # Map pod name as a label
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # Map container name as a label
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: container
          # Map the app label from the pod for easy filtering in Grafana
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          # Build the path to the log file on the node
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            action: replace
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/$2/*.log

---
# ----- Promtail DaemonSet -----
# A DaemonSet ensures exactly one Promtail pod runs on every node,
# so no node's logs are missed.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail

      # Run on every node including control-plane nodes
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

      containers:
        - name: promtail
          image: grafana/promtail:2.9.6   # pinned – matches Loki version
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          ports:
            - containerPort: 9080
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            # Mount the host's pod log directory (read-only)
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            # Mount the host's Docker container logs (read-only)
            - name: docker-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 20
            periodSeconds: 15

      volumes:
        - name: config
          configMap:
            name: promtail-config
        # Host path volumes to access node-level log files
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: docker-logs
          hostPath:
            path: /var/lib/docker/containers
