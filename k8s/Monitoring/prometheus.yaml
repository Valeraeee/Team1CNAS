---
# ClusterRole grants Prometheus read access to pods, services, endpoints,
# and nodes across all namespaces so it can auto-discover scrape targets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole # defines permission for cluster
metadata:
  name: prometheus-permission
rules:
  - apiGroups: [""] #Core API Group - fundamental Kurbenetes resources
    resources:
      - nodes
      - nodes/proxy # allows Prometheus to reach the node metrics through Kubernetes.
      - services # knows where apps are running
      - endpoints # knows which pod belongs to which service
      - pods # discover newly created pod
    verbs: ["get", "list", "watch"] # allow above resources to read show and monitor
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses #central entry point for monitoring resources
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"] # endpoint exposed by kubelet on each kurbenetes node
    verbs: ["get"]

---
apiVersion: v1
kind: ServiceAccount # defines who will use permission
metadata:
  name: prometheus-pod
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef: # Tells Kurbenetes whihc role should be assigned
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-permission

subjects: # who receieves permission
  - kind: ServiceAccount
    name: prometheus-pod
    namespace: monitoring

---
# prometheus-config holds the full scrape configuration.
# Each job maps to a component we want to monitor:
#   - kubernetes-nodes        : node CPU, memory, disk metrics via kubelet
#   - kubernetes-pods         : auto-discovers pods that expose /metrics
#   - php-app                 : Apache metrics converted by apache-exporter
#   - mysql-exporter          : MySQL performance metrics (if deployed)
apiVersion: v1
kind: ConfigMap # Stores non-sensitive config of file settings different form application
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: | #Creates file inside ConfigMap
    global: #global settings used by prometheus
      scrape_interval:     15s   # Pull metrics every 15 seconds
      evaluation_interval: 15s   # check alert rules every 15 seconds

    scrape_configs: # telling Prometheus what to monitor

      # ── Node metrics via kubelet ──────────────────────────────────────────
      - job_name: 'kubernetes-nodes' #monitor every kubernetes worker node
        scheme: https #prometheus communicates with kurbenetes API server over https so its transmitted securely

        tls_config: #Certificate to establish encrypted connection to kurbenetes API server
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: false

        #Authentication token for ServiceAccount for API server to discover/ retrieve metrics
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        
        kubernetes_sd_configs: # Ask Kurbenetes to show all code in cluster for discovery
          - role: node
        
        # How to prepare information for Grafana
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443

            #node name inside cluster
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            # ${1} is the node name cluster. Tells Prometheus exactly where to retrieve node metrics
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # ── cAdvisor (collect container level metrics) ───────────────────────────────
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: false
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # ── Auto-discover all pods that expose a /metrics endpoint ───────────
      # Pods must carry annotation: prometheus.io/scrape: "true"
      - job_name: 'kubernetes-pods'

        kubernetes_sd_configs:
          - role: pod # Shows all Pods currently running in Kubernetes

        relabel_configs:
          #Checks if Pod has annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

          # Metric doesnt always expose same URL
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # Different application expose metrics on different ports
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

          # Copies lebels into Prometheus so Grafana can filter
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace

          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # ── PHP application – Apache status endpoint ──────────────────────────
      # Requires mod_status enabled in the php-webapp Dockerfile.
      # Shows: active/total requests, idle/busy workers, server uptime
      - job_name: 'php-app'
        static_configs:
          - targets: ['127.0.0.1:9117']
        
      # ── Kubernetes API server (Discovers endpoint) ─────────────────────────────────────────────
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        #authenticate using ServiceAccount token
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name,
               __meta_kubernetes_endpoint_port_name]
              # Namespace, Service name, Endpoint port

            action: keep
            regex: default;kubernetes;https

---
# Persistent storage for Prometheus metrics.
# 8Gi gives roughly 2–3 weeks of data at typical scrape volumes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce # One node can mount the storage with read and write access.
  resources:
    requests:
      storage: 8Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1 # Runs one Prometheus instance
  # The TSDB uses a ReadWriteOnce persistent disk. Stop the old pod before
  # starting its replacement so two nodes never attempt to attach it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-pod

      # Run as non-root for security hardening
      securityContext:
        runAsNonRoot: true # best security practice
        runAsUser: 65534   # nobody
        fsGroup: 65534

      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0 # Specify which Prometheus image to run
          args:
            - "--config.file=/etc/prometheus/prometheus.yml" # Loads prometheus config from ConfigMap
            - "--storage.tsdb.path=/prometheus"
            # Retain 15 days of metrics
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"   # allows hot-reload via POST /-/reload
          ports:
            - containerPort: 9090
              name: web
          # Reserve resources and prevent Prometheus from using excessive CPU or memory
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus

          # Checks if prometheus is health and ready before sendinf traffic
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10

        # Apache's mod_status endpoint is not Prometheus formatted. This
        # sidecar converts it and exposes compatible metrics on port 9117.
        - name: apache-exporter
          image: lusotycoon/apache-exporter:v1.1.1
          args:
            - '--scrape_uri=http://php-app.default.svc.cluster.local/server-status?auto'
          ports:
            - name: apache-metrics
              containerPort: 9117
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9117
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9117
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: prometheus-storage
        # Connect ConfigMap and  Persistent Volume Claim (metric storage) into a container
          persistentVolumeClaim:
            claimName: prometheus-pvc

---
# ClusterIP service exposes Prometheus internally so Grafana can reach it.
# NodePort 30090 gives direct browser access during demos without an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
