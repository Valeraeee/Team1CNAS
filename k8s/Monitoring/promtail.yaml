---
# Promtail is the log shipping agent for Loki.
# It runs as a DaemonSet so every node has one instance collecting
# container logs from /var/log/pods and shipping them to Loki.

# ── RBAC ─────────────────────────────────────────────────────────────────────
# Promtail needs read access to pods and namespaces so it can attach
# Kubernetes metadata labels (namespace, pod name, container name) to each log line.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - services
      - pods
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
# Promtail configuration:
#   - server:    exposes /metrics (scraped by Prometheus) and /ready probe
#   - positions: tracks how far through each log file Promtail has read,
#                so it resumes from the right place after a pod restart
#   - clients:   the Loki endpoint to push logs to
#   - scrape_configs: Kubernetes pod discovery with relabelling
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0    # disable gRPC – not needed for basic log shipping

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki-service:3100/loki/api/v1/push

    scrape_configs:
      # ── Kubernetes pod log discovery ──────────────────────────────────────
      # Reads logs from /var/log/pods on the host node.
      # GKE uses containerd (CRI) as the container runtime, which writes logs
      # in CRI format rather than Docker JSON format, so the cri stage is used.
      - job_name: kubernetes-pods

        pipeline_stages:
          - cri: {}  # GKE/containerd writes CRI-format logs, not Docker JSON

        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          # Keep only pods running on the same node as this Promtail instance.
          # ${HOSTNAME} is injected from the HOSTNAME env var (spec.nodeName).
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: keep
            regex: ${HOSTNAME}

          # Drop pods that have opted out with annotation:
          #   promtail.io/scrape: "false"
          - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
            action: drop
            regex: "false"

          # Attach useful Kubernetes metadata as Loki labels so you can
          # filter logs in Grafana by namespace, pod, container, etc.
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

          # Build the path to the log file on the host node.
          # GKE writes logs to: /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          # $1 expands to "pod-uid/container-name" (separator: /), so the final
          # glob becomes: /var/log/pods/*pod-uid/container-name/*.log
          # This matches the actual directory structure without the extra wildcard level.
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log

---
# ── DaemonSet ─────────────────────────────────────────────────────────────────
# A DaemonSet ensures exactly one Promtail pod runs on every node.
# Each pod mounts the node's /var/log/pods directory (read-only) so it
# can read the container log files written by the kubelet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
      annotations:
        # Let Prometheus scrape Promtail's own metrics (pipeline lag, bytes sent, etc.)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9080"
    spec:
      serviceAccountName: promtail

      # Tolerate the control-plane taint so logs from control-plane nodes
      # are also collected (optional – remove if you only have worker nodes).
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

      containers:
        - name: promtail
          image: grafana/promtail:2.9.8   # matches the Loki version in loki.yaml
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
            - "-config.expand-env=true"
          ports:
            - name: http-metrics
              containerPort: 9080
          env:
            # Inject the node name so Promtail can filter to its own node's pods
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              ephemeral-storage: "1Gi"
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "1Gi"
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            # Read-only access to the node's container log files
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # Writable volume for Promtail to persist its read position file
            - name: positions
              mountPath: /run/promtail
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
          # Liveness probe intentionally removed: Promtail's /ready returns 500
          # while it is still scanning for log files. A liveness probe against
          # /ready would cause the container to be killed before it finds any
          # logs, creating a restart loop. The readiness probe is sufficient.

      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        # Mount the host node's /var/log so Promtail can read pod log files.
        # hostPath is intentionally read-only for security.
        - name: varlog
          hostPath:
            path: /var/log
        # emptyDir persists across container restarts (but not pod evictions).
        # For a demo cluster this is fine; use a hostPath if you need it to
        # survive pod rescheduling.
        - name: positions
          emptyDir: {}
