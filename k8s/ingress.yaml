apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # Instructs cert-manager to issue a certificate
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - app.cnas.local
    secretName: cnas-app-tls # Secret where cert-manager saves the SSL certificate
  rules:
  - host: app.cnas.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: php-app-service
            port:
              number: 80
